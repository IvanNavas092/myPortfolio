<!-- CHAT IA -->
<button class="fixed bottom-4 right-4 cursor-pointer max-w-32 z-50 focus:outline-none group" (click)="toggleChat()">
    <div
        class="hover:scale-105 p-4 md:p-6 rounded-full transition-all duration-100 z-30 flex justify-items-center bg-white/10 border border-gray-200/20 backdrop-blur-lg">
        <img src="icons/ai-icon.png" alt="ai button"
            class="w-6 h-6 animate-pulse group-hover:animate-none transition-all duration-300">
    </div>
</button>

@if (isOpen) {
<div class="fixed inset-x-3 bottom-24 md:inset-x-auto md:bottom-30 md:right-4 z-40 animate-fade-in-up">
    <!-- Contenedor Principal (Efecto Cristal Premium) -->
    <div
        class="h-[520px] max-h-[calc(100svh-7rem)] md:max-h-[calc(100svh-9rem)] w-full md:w-[380px] rounded-2xl border border-gray-200/20 bg-white/10 backdrop-blur-2xl shadow-2xl p-4 md:p-5 flex flex-col gap-3 md:gap-4 overflow-hidden relative">

        <div class="absolute -top-20 -right-20 w-40 h-40  rounded-full blur-3xl pointer-events-none">
        </div>
        <div class="absolute -bottom-20 -left-20 w-40 h-40  rounded-full blur-3xl pointer-events-none">
        </div>

        <!-- ZONA DE MENSAJES -->
        <div #chatContainer
            class="flex flex-1 min-h-0 flex-col gap-3 overflow-y-auto overscroll-contain pr-1 relative z-10 scrollbar-thin">
            @for (item of messages | async; track $index) {
            <div class="rounded-2xl px-4 py-3 max-w-[88%] md:max-w-[85%] text-sm md:text-xs leading-relaxed shadow-sm transition-all break-words"
                [class.bg-[var(--background-color)]/40]="item.role === 'person'"
                [class.text-zinc-200]="item.role === 'person'" [class.self-end]="item.role === 'person'"
                [class.bg-gradient-to-br]="item.role === 'ai'"
                [class.from-[var(--secondary-color)]]="item.role === 'ai'"
                [class.to-[var(--font-secondary-color)]]="item.role === 'ai'" [class.text-gray-100]="item.role === 'ai'"
                [class.self-start]="item.role === 'ai'">
                <p>
                    {{ item.message }}
                </p>
            </div>
            }
        </div>

        @if (isLoading) {
        <p class="shrink-0 text-xs md:text-sm font-light text-gray-400 animate-pulse">Estoy preguntando a Iván, dame un
            momento...</p>
        }

        <!-- FORMULARIO DE ENTRADA -->
        <div class="flex items-end w-full relative z-10 pt-1 md:pt-2 shrink-0">
            <form (ngSubmit)="sendMessage(message)"
                class="flex gap-2 w-full items-center bg-zinc-950/60 border border-zinc-800/80 rounded-xl p-1.5 transition-all">
                <input
                    class="bg-transparent text-zinc-200 rounded-lg pl-3 pr-2 py-2 text-base md:text-xs flex flex-1 min-w-0 focus:outline-none placeholder-zinc-500"
                    [(ngModel)]="message" type="text" name="message" placeholder="Pregunta lo que quieras...">

                <button
                    class="shrink-0 cursor-pointer text-white rounded-lg px-3 md:px-4 py-2 text-xs font-medium bg-gradient-to-r from-[var(--secondary-color)] to-[var(--theme-color)]/10 shadow-md  transition-all duration-200 active:scale-95"
                    type="submit">
                    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 12H5m14 0-4 4m4-4-4-4" />
                    </svg>
                </button>
            </form>
        </div>

    </div>
</div>
}
