<!-- CHAT IA -->
<button class="fixed bottom-4 right-4 cursor-pointer max-w-32 z-50 focus:outline-none group" (click)="toggleChat()">
    <div
        class="hover:scale-110 p-6 rounded-full transition-all duration-100 z-30 flex justify-items-center bg-white/10 border border-gray-200/20 backdrop-blur-lg">
        <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
            width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 10.5h.01m-4.01 0h.01M8 10.5h.01M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-6.6a1 1 0 0 0-.69.275l-2.866 2.723A.5.5 0 0 1 8 18.635V17a1 1 0 0 0-1-1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" />
        </svg>


    </div>
</button>

@if (isOpen) {
<div
    class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 md:top-auto md:left-auto md:translate-x-0 md:translate-y-0 md:bottom-30 md:right-4 z-40 animate-fade-in-up">
    <!-- Contenedor Principal (Efecto Cristal Premium) -->
    <div
        class="h-[520px] w-[380px] rounded-2xl border border-gray-200/20 bg-white/10 backdrop-blur-2xl shadow-2xl p-5 flex flex-col gap-4 overflow-hidden relative">

        <div class="absolute -top-20 -right-20 w-40 h-40 bg-purple-600/10 rounded-full blur-3xl pointer-events-none">
        </div>
        <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-fuchsia-600/10 rounded-full blur-3xl pointer-events-none">
        </div>

        <!-- CABECERA -->
        <div class="relative z-10">
            <div class="flex items-center gap-2 pb-3">
                <h1 class="font-medium text-sm tracking-wide text-[var(--font-first-color)]">Asistente de Iván Navas
                </h1>
            </div>
            <hr class="border-[var(--font-second-color)]/60">
        </div>

        <!-- ZONA DE MENSAJES -->
        <div #chatContainer class="flex flex-1 flex-col gap-3 overflow-y-auto pr-1 relative z-10 scrollbar-thin">
            @for (item of messages | async; track $index) {
            <div class="rounded-2xl px-4 py-3 max-w-[85%] text-xs leading-relaxed shadow-sm transition-all break-words"
                [class.bg-[var(--theme-color)]/40]="item.role === 'person'"
                [class.text-zinc-200]="item.role === 'person'" [class.border="item.role === 'person'" ]
                [class.border-gray-200/20]="item.role === 'person'" [class.self-end]="item.role === 'person'"
                [class.bg-gradient-to-br]="item.role === 'ai'" [class.from-[var(--theme-color)]]="item.role === 'ai'"
                [class.to-[var(--font-secondary-color)]]="item.role === 'ai'"
                [class.text-purple-100]="item.role === 'ai'" [class.border="item.role === 'ai'" ]
                [class.border-purple-500/30]="item.role === 'ai'" [class.self-start]="item.role === 'ai'">
                <p>
                    {{ item.message }}
                </p>
            </div>
            }
        </div>

        @if (isLoading) {
        <p class="text-sm font-light text-gray-400 animate-pulse">Estoy preguntando a Iván, dame un momento...</p>
        }

        <!-- FORMULARIO DE ENTRADA -->
        <div class="flex items-end w-full relative z-10 pt-2">
            <form (ngSubmit)="sendMessage(message)"
                class="flex gap-2 w-full items-center bg-zinc-950/60 border border-zinc-800/80 rounded-xl p-1.5 focus-within:border-purple-500/50 focus-within:shadow-[0_0_15px_rgba(168,85,247,0.1)] transition-all">
                <input
                    class="bg-transparent text-zinc-200 rounded-lg pl-3 pr-2 py-2 text-xs flex flex-1 focus:outline-none placeholder-zinc-500"
                    [(ngModel)]="message" type="text" name="message" placeholder="Pregunta lo que quieras...">

                <button
                    class="cursor-pointer text-white rounded-lg px-4 py-2 text-xs font-medium bg-gradient-to-r from-[var(--theme-color)] to-[var(--theme-color)]/50 shadow-md shadow-purple-900/30 transition-all duration-200 active:scale-95"
                    type="submit">
                    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 12H5m14 0-4 4m4-4-4-4" />
                    </svg>

                </button>
            </form>
        </div>

    </div>
</div>
}
